<div id="goaltracker-panel" class="hidden w-full panel-fade">
    <div style="max-width:820px;margin:0 auto;">

        <!-- Header -->
        <div class="rounded-2xl px-6 py-5 mb-5 text-white shine-header" style="background:linear-gradient(135deg,#1e3a5f 0%,#1a4070 40%,#1a3a5c 100%);border:2px solid rgba(245,200,66,0.45);box-shadow:0 4px 18px rgba(0,0,0,0.25);">
            <div class="flex items-start justify-between flex-wrap gap-3">
                <div>
                    <h2 data-i18n="page.goaltracker.h" class="text-xl font-black flex items-center gap-2">🎯 Goal Tracker</h2>
                    <p data-i18n="goaltracker.subtitle" class="text-blue-200 text-xs mt-1">Log your savings progress and stay on track toward every financial goal</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="switchMode('goal')" data-i18n="gt.btn.newgoal" class="px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all" style="background:rgba(245,200,66,0.15);color:#f5c842;border:1px solid rgba(245,200,66,0.3);">+ New Goal</button>
                    <button onclick="switchMode('dashboard')" data-i18n="gt.btn.back" class="px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.15);">← Back</button>
                </div>
            </div>
        </div>

        <!-- Goals container — populated by initGoalTracker() in goal-tracker.js -->
        <div id="gt-goals-container"></div>

    </div>
</div>
